# Builds the site with Hugo and publishes it to GitHub Pages.
#
# NOTE: this requires Settings -> Pages -> "Build and deployment" -> Source to
# be set to "GitHub Actions".  While it is still set to "Deploy from a branch"
# this workflow will build but the deploy step will fail.
#
# Emacs is deliberately not installed here: content/*.md is committed, so CI
# only ever runs Hugo.  Regenerate the Markdown locally with `make export`.

name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        run: |
          wget -q -O hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Hugo's .Lastmod / .GitInfo need the full history

      # The Congo theme is a Hugo Module, which is fetched with the Go toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/hugo_cache
          key: hugo-mod-${{ hashFiles('go.sum') }}
          restore-keys: hugo-mod-

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
