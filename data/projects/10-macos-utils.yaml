    link: https://github.com/alberti42/SSHuttleBar
    description: This apps allows you to control the CLI utility [`sshuttle`](https://github.com/sshuttle/sshuttle) direclty from the macOS menu bar. Thereby, one can emulate the functionality of a VPN by leveraging SSH connections. The program works, but the documentation is still missing. It integrates with 1Password SSH agent to retrieve automatically the password of remote servers.
