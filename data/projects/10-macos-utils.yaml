  - title: macOS Hotkey Manager
    link: https://github.com/alberti42/macOS-hotkeys-manager
    description: A Python script for exporting, importing and resetting macOS application hotkeys. This is particularly useful if you need to transfer your custom keyboard shortcuts to a different machine or back them up for safekeeping.
    ranking: 1

  - title: Magic Warnings
    link: https://github.com/alberti42/Magic-Warnings
    description: A lightweight macOS app that monitors the battery levels of your Apple Magic Mouse, Trackpad, and Keyboard.
    ranking: 1

  - title: SSHuttleBar
    link: https://github.com/alberti42/SSHuttleBar
    description: This apps allows you to control the CLI utility [`sshuttle`](https://github.com/sshuttle/sshuttle) direclty from the macOS menu bar. Thereby, one can emulate the functionality of a VPN by leveraging SSH connections. The program works, but the documentation is still missing. It integrates with 1Password SSH agent to retrieve automatically the password of remote servers.
    ranking: 1
    disabled: true   # hidden from /projects/; flip to false to publish

  - title: SyncGlass
    link: https://github.com/alberti42/SyncGlass
    description: A menu-bar app for macOS that shows which files iCloud Drive is uploading and downloading. It lists iCloud Drive's transfers in one place — how many files are in flight, each file's percentage, and when each transfer finished — and can notify you when uploads or downloads finish. Signed and notarized; requires macOS 26 or later.
    ranking: 1

  - title: Volume Control App
    link: https://github.com/alberti42/Volume-Control
    description: Control the volume of Apple Music, Spotify, Doppler, Swinsian, and your display with your keyboard's volume keys. When one of these players is playing, the volume keys change its volume; otherwise, they change the system volume. AirPlay speakers follow the music app's volume, not the Mac's system volume, so this is the way to set their volume from the keyboard. Display volume goes through [BetterDisplay](https://github.com/waydabber/BetterDisplay) or [Lunar](https://github.com/alin23/Lunar). Notarized; supports Ventura and newer, and installs with `brew install --cask volume-control`.
    ranking: 1

  - title: iTunes Volume Control
    link: https://github.com/alberti42/iTunes-Volume-Control
    description: The app is discontinued and superceded by Volume Control. The reason is that iTunes does no longer exist in recent macOS versions. Also, the newer app, Volume Control, is no longer restricted to Apple Music. It also works with Spotify and a few other music players.
    ranking: 2
