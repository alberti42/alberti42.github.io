title: LaunchBar Actions
weight: 50
intro: These are plugins developed to improve the workflow with [LaunchBar](https://www.obdev.at/products/launchbar/index.html).

items:
  - title: Get Recent Adobe Documents
    link: https://github.com/alberti42/Get-Recent-Adobe-Documents-For-LaunchBar
    description: A plugin for LaunchBar to display the list of the documents recently opened with the Adobe programs [Acrobat](https://www.adobe.com/acrobat.html), [Photoshop](https://www.adobe.com/products/photoshop.html), [Illustrator](https://www.adobe.com/products/illustrator.html).

  - title: Get Recent MATLAB Documents
    link: https://github.com/alberti42/Get-Recent-MATLAB-Documents-For-LaunchBar
    description: A plugin for LaunchBar to display the list of the documents recently opened with [Mathworks MATLAB](https://www.mathworks.com/).

  - title: Get Recent Microsoft Office Documents
    link: https://github.com/alberti42/Get-Recent-Microsoft-Office-Documents-For-LaunchBar
    description: A plugin for LaunchBar to display the list of the documents recently opened with the Microsoft Office programs [Word](https://www.microsoft.com/en-us/microsoft-365/word), [Excel](https://www.microsoft.com/en-us/microsoft-365/excel), and [PowerPoint](https://www.microsoft.com/en-us/microsoft-365/powerpoint).

  - title: Get Recent Visual Studio Code Documents
    link: https://github.com/alberti42/Get-Recent-VS-Code-Documents-For-LaunchBar
    description: A plugin for LaunchBar to display the list of the documents recently opened with [Visual Studio Code](https://code.visualstudio.com/).

  - title: Get Recently Opened Files with Emacs for LaunchBar
    link: https://github.com/alberti42/List-Emacs-Recentf-From-LaunchBar
    description: A plugin for LaunchBar to display the list of the recentf files opened with [Emacs ](https://www.gnu.org/software/emacs/) editor.

  - title: Get Recently Opened Files with Sublime Text for LaunchBar
    link: https://github.com/alberti42/Get-Recent-ST-Files-For-LaunchBar
    description: A plugin for LaunchBar to display the list of the files and projects recently opened with [Sublime Text](https://www.sublimetext.com/) editor. This plugin is designed to work together with the companion plugin [Recent Files Tracker](https://github.com/alberti42/sublime-recent-files-tracker) for Sublime Text editor.

  - title: Get Wolfram Mathematica Recent Documents
    link: https://github.com/alberti42/Get-Recent-Mathematica-Documents-For-LaunchBar
    description: A plugin for LaunchBar to display the list of the documents recently opened with [Wolfram Mathematica](https://www.wolfram.com/mathematica/).

  - title: Open iTerm2 Profile
    link: https://github.com/alberti42/Open-iTerm2-Profile
    description: A plugin for LaunchBar that allows users to quickly open a terminal session using any available [iTerm2](https://iterm2.com/) profile.
